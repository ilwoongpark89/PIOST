<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PIOST Analytics</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --crimson: #B22234;
            --crimson-bright: #D42A42;
            --ember: #C44505;
            --navy: #1B365D;
            --paper: #FFFFFF;
            --paper-2: #F5F7FA;
            --well: #EEF2F7;
            --line: #E4E9F0;
            --ink-1: #122036;
            --ink-2: #46566E;
            --ink-3: #5F6E86;
            --ink-4: #93A0B4;
            --radius-s: 10px;
            --radius-m: 14px;
            --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                system-ui, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: var(--font); background: var(--well); color: var(--ink-1); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        button, input { font-family: inherit; font-size: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; }
        .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
        .tnum { font-variant-numeric: tabular-nums; }

        /* ── Login ─────────────────────────────────────────────── */
        #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        #login .box { width: 100%; max-width: 360px; }
        #login .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px; }
        #login .logo { height: 48px; width: 48px; border-radius: 12px; background: linear-gradient(108deg, var(--crimson-bright), var(--ember)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; letter-spacing: -0.02em; }
        #login .kicker { margin-top: 18px; font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--crimson); }
        #login h1 { margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        #login p.sub { margin-top: 8px; font-size: 13px; color: var(--ink-3); }
        #login form { margin-top: 8px; }
        .pw-wrap { position: relative; }
        .pw-wrap input { height: 48px; width: 100%; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--paper); padding: 0 46px 0 14px; outline: none; transition: border-color .15s; }
        .pw-wrap input:focus { border-color: var(--ink-3); }
        .pw-wrap button { position: absolute; right: 6px; top: 6px; height: 36px; width: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink-4); }
        .pw-wrap button:hover { background: var(--well); color: var(--ink-2); }
        .btn-primary { height: 48px; width: 100%; margin-top: 12px; border-radius: var(--radius-s); background: var(--crimson); color: #fff; font-weight: 600; transition: background .15s, opacity .15s; }
        .btn-primary:hover { background: #9c1d2d; }
        .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
        .err { margin-top: 12px; font-size: 12px; color: var(--crimson); display: flex; gap: 6px; align-items: center; }
        #login .foot { margin-top: 30px; text-align: center; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-4); }

        /* ── App shell ─────────────────────────────────────────── */
        #app { display: none; min-height: 100vh; }
        header.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
        header.top .inner { max-width: 1200px; margin: 0 auto; height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand-row { display: flex; align-items: center; gap: 10px; }
        .brand-row .logo { height: 30px; width: 30px; border-radius: 8px; background: linear-gradient(108deg, var(--crimson-bright), var(--ember)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
        .brand-row span { font-weight: 700; letter-spacing: -0.01em; }
        .ctrls { display: flex; align-items: center; gap: 8px; }
        .seg { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--paper); padding: 3px; }
        .seg button { padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-3); transition: background .15s, color .15s; }
        .seg button.on { background: var(--navy); color: #fff; }
        .icon-btn { height: 36px; width: 36px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--paper); color: var(--ink-2); display: flex; align-items: center; justify-content: center; transition: background .15s; }
        .icon-btn:hover { background: var(--well); }
        .txt-btn { height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--paper); color: var(--ink-2); font-size: 13px; }
        .txt-btn:hover { background: var(--well); }

        main { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .titlerow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
        .titlerow h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        .titlerow .meta { margin-top: 2px; font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
        .filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--paper); padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); transition: background .15s; }
        .chip:hover { background: var(--well); }
        .chip.on { background: var(--navy); color: #fff; border-color: transparent; }
        .chip .dot { height: 7px; width: 7px; border-radius: 50%; }
        .chip .n { color: var(--ink-4); }
        .chip.on .n { color: rgba(255,255,255,.7); }

        .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1024px) { .kpis { grid-template-columns: repeat(7, 1fr); } }
        .kpi { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; }
        .kpi .lab { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
        .kpi .val { margin-top: 8px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
        .kpi .val .trend { font-family: var(--mono); font-size: 12px; font-weight: 500; margin-left: 6px; color: var(--ink-3); }
        .kpi .val .trend.up { color: #15803d; }
        .kpi .val .trend.down { color: var(--crimson); }
        .kpi .sub { margin-top: 2px; font-size: 11px; color: var(--ink-4); }

        .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-m); }
        .panel > .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .panel > .head h2 { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
        .panel > .head .psub { margin-top: 2px; font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
        .panel > .body { padding: 16px; }
        .grid { display: grid; gap: 16px; }
        @media (min-width: 640px) { .g2 { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 640px) { .g2x { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 640px) and (max-width: 1023px) { .g4 { grid-template-columns: repeat(2, 1fr); } }

        /* bar list */
        .bars { display: flex; flex-direction: column; gap: 10px; }
        .bar .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
        .bar .lbl { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--ink-2); }
        .bar .lbl .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bar .lbl .sub { color: var(--ink-4); flex-shrink: 0; font-size: 12px; }
        .bar .lbl .dot { height: 8px; width: 8px; border-radius: 50%; flex-shrink: 0; }
        .bar .num { flex-shrink: 0; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
        .bar .num .pct { margin-left: 6px; color: var(--ink-4); }
        .bar .track { height: 6px; width: 100%; border-radius: 999px; background: var(--well); overflow: hidden; }
        .bar .fill { height: 100%; border-radius: 999px; background: var(--navy); }
        .empty { padding: 24px 0; text-align: center; color: var(--ink-4); font-size: 13px; }
        .cbtn { color: var(--ink-2); text-align: left; }
        .cbtn:hover { color: var(--crimson); }
        .cbtn.on { color: var(--crimson); font-weight: 600; }

        /* chart */
        .chart { width: 100%; height: 280px; }
        .chart svg { width: 100%; height: 100%; display: block; }

        /* heatmap */
        .heat-scroll { overflow-x: auto; }
        .heat { min-width: 560px; }
        .heat .r { display: flex; align-items: center; gap: 4px; }
        .heat .wd { width: 20px; flex-shrink: 0; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
        .heat .cells { display: flex; flex: 1; gap: 3px; padding: 2px 0; }
        .heat .c { height: 16px; flex: 1; border-radius: 2px; }
        .heat .axis { display: flex; flex: 1; gap: 3px; margin-top: 6px; }
        .heat .axis span { flex: 1; text-align: center; font-family: var(--mono); font-size: 9px; color: var(--ink-4); }

        /* sessions */
        .sessions { max-height: 440px; overflow-y: auto; }
        .sess { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .sess:last-child { border-bottom: none; }
        .sess .paths { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; flex: 1; }
        .sess .who { font-size: 12px; margin-right: 4px; white-space: nowrap; }
        .sess .who b { color: var(--ink-2); font-weight: 600; }
        .sess .who span { color: var(--ink-4); }
        .sess .pth { border: 1px solid var(--line); background: var(--paper-2); border-radius: 5px; padding: 2px 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
        .sess .arr { color: var(--ink-4); }
        .sess .stat { flex-shrink: 0; display: flex; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding-top: 2px; }

        /* table */
        .search { position: relative; }
        .search input { height: 36px; width: 180px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--paper); padding: 0 12px 0 32px; outline: none; }
        .search input:focus { border-color: var(--ink-3); }
        .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-4); pointer-events: none; }
        .tbl-wrap { max-height: 560px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th { position: sticky; top: 0; z-index: 1; background: var(--paper); text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
        tbody td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
        tbody tr.click { cursor: pointer; }
        tbody tr.click:hover, tbody tr.open { background: var(--paper-2); }
        .exp dl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 24px; padding: 4px 0; }
        @media (min-width: 640px) { .exp dl { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .exp dl { grid-template-columns: repeat(4, 1fr); } }
        .exp dt { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-4); }
        .exp dd { margin-top: 2px; color: var(--ink-2); word-break: break-word; }
        .exp .full { grid-column: 1 / -1; }
        .exp .full dd { font-family: var(--mono); font-size: 11px; color: var(--ink-3); word-break: break-all; }
        .note { margin-top: 12px; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
        .hide-sm { display: none; }
        @media (min-width: 768px) { .hide-md { display: table-cell; } }
        @media (min-width: 1024px) { .hide-lg { display: table-cell; } }
        @media (max-width: 767px) { .hide-md { display: none; } }
        @media (max-width: 1023px) { .hide-lg { display: none; } }
        .badge { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .badge .dot { height: 7px; width: 7px; border-radius: 50%; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- ── Login ─────────────────────────────────────────────── -->
    <section id="login">
        <div class="box">
            <div class="brand">
                <div class="logo">P</div>
                <p class="kicker">Admin Access</p>
                <h1>PIOST Analytics</h1>
                <p class="sub">관리자 비밀번호를 입력하세요</p>
            </div>
            <form id="loginForm">
                <div class="pw-wrap">
                    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
                    <button type="button" id="togglePw" aria-label="비밀번호 표시">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
                <div class="err" id="loginErr" style="display:none"></div>
                <button type="submit" class="btn-primary" id="loginBtn">로그인</button>
            </form>
            <p class="foot">PIOST · Multiphase Flow Thermal Engineering</p>
        </div>
    </section>

    <!-- ── App ───────────────────────────────────────────────── -->
    <div id="app">
        <header class="top">
            <div class="inner">
                <div class="brand-row">
                    <div class="logo">P</div>
                    <span>PIOST Analytics</span>
                </div>
                <div class="ctrls">
                    <div class="seg" id="periodSeg"></div>
                    <button class="icon-btn" id="refreshBtn" aria-label="새로고침">
                        <svg id="refreshIcon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </button>
                    <button class="txt-btn" id="logoutBtn">로그아웃</button>
                </div>
            </div>
        </header>
        <main>
            <div class="titlerow">
                <div>
                    <h1>접속자 통계</h1>
                    <div class="meta" id="metaLine"></div>
                </div>
                <div class="filters" id="sourceFilters"></div>
            </div>
            <div class="kpis" id="kpis"></div>
            <div class="panel">
                <div class="head"><div><h2>일자별 방문</h2><div class="psub" id="chartSub"></div></div></div>
                <div class="body"><div class="chart" id="chart"></div></div>
            </div>
            <div class="grid g4" id="composition"></div>
            <div class="panel">
                <div class="head"><div><h2>요일 × 시간대</h2><div class="psub" id="heatSub"></div></div></div>
                <div class="body"><div class="heat-scroll"><div class="heat" id="heat"></div></div></div>
            </div>
            <div class="grid g2" id="geo"></div>
            <div class="grid g3" id="acq"></div>
            <div class="grid g3" id="tech"></div>
            <div id="sessionsPanel"></div>
            <div class="panel">
                <div class="head">
                    <div><h2>방문 상세</h2><div class="psub" id="tblSub"></div></div>
                    <div style="display:flex;gap:8px;align-items:center">
                        <div class="search">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"/></svg>
                            <input id="search" placeholder="국가·도시·UA·경로 검색">
                        </div>
                        <button class="txt-btn" id="csvBtn">CSV</button>
                    </div>
                </div>
                <div class="body">
                    <div class="tbl-wrap">
                        <table id="tbl"></table>
                    </div>
                    <p class="note">기기·OS·브라우저는 User-Agent 기반 추정값입니다 (근사).</p>
                </div>
            </div>
        </main>
    </div>

    <script>
    (function () {
        'use strict';

        // ── constants ────────────────────────────────────────────────────────
        var CRIMSON = '#B22234', NAVY = '#1B365D', INK3 = '#5F6E86', GRID = '#E4E9F0';
        var WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
        var PERIODS = [{ d: 1, l: '1D' }, { d: 7, l: '7D' }, { d: 30, l: '30D' }, { d: 90, l: '90D' }];
        var SOURCE_META = {
            all: { label: '전체', dot: '' },
            human: { label: '방문자', dot: NAVY },
            build: { label: '빌드', dot: '#A8A29E' },
            bot: { label: '봇/AI', dot: CRIMSON },
        };

        // ── state ────────────────────────────────────────────────────────────
        var S = { pw: '', period: 7, source: 'all', country: null, countryScope: 'period', search: '', expanded: null, data: null, loading: false, updated: null };

        // ── helpers ──────────────────────────────────────────────────────────
        function $(id) { return document.getElementById(id); }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function num(n) { return (Number(n) || 0).toLocaleString(); }
        function fmtDur(sec) {
            sec = Number(sec) || 0;
            if (sec < 1) return '—';
            if (sec < 60) return sec + '초';
            var m = Math.floor(sec / 60), s = sec % 60;
            return s ? (m + '분 ' + s + '초') : (m + '분');
        }
        function classifyUA(ua) {
            var l = (ua || '').toLowerCase();
            if (l.indexOf('vercel') > -1 || l.indexOf('node-fetch') > -1 || l.indexOf('undici') > -1) return 'build';
            if (l.indexOf('claude') > -1 || l.indexOf('anthropic') > -1 || l.indexOf('chatgpt') > -1 || l.indexOf('openai') > -1 || l.indexOf('gptbot') > -1) return 'bot';
            if (l.indexOf('bot') > -1 || l.indexOf('crawler') > -1 || l.indexOf('spider') > -1 || l.indexOf('headless') > -1) return 'bot';
            return 'human';
        }
        function parseUA(ua) {
            var u = (ua || '').toLowerCase(), device = 'Desktop', os = 'Other', browser = 'Other';
            if (/ipad|tablet|playbook|silk/.test(u) || (/android/.test(u) && !/mobile/.test(u))) device = 'Tablet';
            else if (/mobi|iphone|ipod|windows phone|iemobile/.test(u)) device = 'Mobile';
            if (/windows nt/.test(u)) os = 'Windows';
            else if (/iphone|ipad|ipod/.test(u)) os = 'iOS';
            else if (/mac os x|macintosh/.test(u)) os = 'macOS';
            else if (/android/.test(u)) os = 'Android';
            else if (/cros/.test(u)) os = 'ChromeOS';
            else if (/linux/.test(u)) os = 'Linux';
            if (/edg\//.test(u)) browser = 'Edge';
            else if (/opr\/|opera/.test(u)) browser = 'Opera';
            else if (/samsungbrowser/.test(u)) browser = 'Samsung';
            else if (/firefox\/|fxios/.test(u)) browser = 'Firefox';
            else if (/chrome\/|crios/.test(u)) browser = 'Chrome';
            else if (/safari\//.test(u)) browser = 'Safari';
            else if (classifyUA(ua) !== 'human') browser = 'Bot';
            return { device: device, os: os, browser: browser };
        }
        function tally(items, keyFn) {
            var m = {};
            items.forEach(function (it) { var k = keyFn(it); if (!k) return; m[k] = (m[k] || 0) + 1; });
            return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; }).sort(function (a, b) { return b.value - a.value; });
        }
        function periodLabel() { return S.period === 1 ? '오늘' : ('최근 ' + S.period + '일'); }

        // ── derivations (respect the source filter) ──────────────────────────
        function allVisits() { return (S.data && S.data.recentVisits) || []; }
        function sourceCounts() {
            var c = { human: 0, build: 0, bot: 0 };
            allVisits().forEach(function (v) { c[classifyUA(v.userAgent)]++; });
            return c;
        }
        function filteredVisits() {
            var av = allVisits();
            return S.source === 'all' ? av : av.filter(function (v) { return classifyUA(v.userAgent) === S.source; });
        }
        function filteredDaily() {
            var out = {};
            if (S.source === 'all' && S.data && S.data.dailyStats) {
                Object.keys(S.data.dailyStats).forEach(function (k) { out[k] = S.data.dailyStats[k]; });
            } else {
                filteredVisits().forEach(function (v) { var day = String(v.timestamp).split('T')[0]; out[day] = (out[day] || 0) + 1; });
                if (S.data && S.data.dailyStats) Object.keys(S.data.dailyStats).forEach(function (d) { if (!(d in out)) out[d] = 0; });
            }
            return out;
        }

        // ── bar list renderer ────────────────────────────────────────────────
        function barList(items, total, opts) {
            opts = opts || {};
            if (!items.length) return '<p class="empty">' + esc(opts.empty || '데이터 없음') + '</p>';
            var peak = opts.max || Math.max.apply(null, [1].concat(items.map(function (i) { return i.value; })));
            return '<div class="bars">' + items.map(function (it) {
                var pct = total ? Math.round((it.value / total) * 100) : 0;
                var lead = it.dot ? '<span class="dot" style="background:' + it.dot + '"></span>' : '';
                var sub = it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : '';
                return '<div class="bar"><div class="row1"><span class="lbl">' + lead +
                    '<span class="txt">' + it.label + '</span>' + sub + '</span>' +
                    '<span class="num">' + num(it.value) + '<span class="pct">' + pct + '%</span></span></div>' +
                    '<div class="track"><div class="fill" style="width:' + ((it.value / peak) * 100) + '%;' + (it.fill ? 'background:' + it.fill : '') + '"></div></div></div>';
            }).join('') + '</div>';
        }
        function panel(title, sub, bodyHtml) {
            return '<div class="panel"><div class="head"><div><h2>' + esc(title) + '</h2>' +
                (sub ? '<div class="psub">' + esc(sub) + '</div>' : '') + '</div></div><div class="body">' + bodyHtml + '</div></div>';
        }

        // ── auth ─────────────────────────────────────────────────────────────
        function showLogin(msg) {
            $('login').style.display = 'flex';
            $('app').style.display = 'none';
            if (msg) { var e = $('loginErr'); e.style.display = 'flex'; e.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' + esc(msg); }
        }
        function showApp() { $('login').style.display = 'none'; $('app').style.display = 'block'; }

        function fetchAnalytics(pwd, days) {
            S.loading = true;
            $('refreshIcon') && $('refreshIcon').classList.add('spin');
            $('loginBtn').textContent = '확인 중…';
            return fetch('/api/analytics?period=' + days, { headers: { 'x-admin-password': pwd } })
                .then(function (r) {
                    if (r.status === 401) { showLogin('비밀번호가 올바르지 않습니다'); throw new Error('unauth'); }
                    return r.json();
                })
                .then(function (result) {
                    S.pw = pwd; S.period = days; S.data = result; S.updated = new Date();
                    try { localStorage.setItem('piost_admin_pwd', pwd); } catch (e) {}
                    showApp(); render();
                })
                .catch(function (err) { if (err.message !== 'unauth') showLogin('데이터를 불러오지 못했습니다'); })
                .then(function () { S.loading = false; $('refreshIcon') && $('refreshIcon').classList.remove('spin'); $('loginBtn').textContent = '로그인'; });
        }

        // ── render ───────────────────────────────────────────────────────────
        function render() {
            if (!S.data) return;
            var d = S.data, pl = periodLabel();
            var fv = filteredVisits(), fd = filteredDaily(), sc = sourceCounts();
            var av = allVisits();

            // meta line
            $('metaLine').textContent = pl + (S.updated ? ' · 갱신 ' + S.updated.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '');

            // period segment
            $('periodSeg').innerHTML = PERIODS.map(function (p) { return '<button data-d="' + p.d + '" class="' + (S.period === p.d ? 'on' : '') + '">' + p.l + '</button>'; }).join('');

            // source filters
            $('sourceFilters').innerHTML = ['all', 'human', 'build', 'bot'].map(function (src) {
                var count = src === 'all' ? av.length : sc[src];
                var m = SOURCE_META[src];
                return '<button class="chip ' + (S.source === src ? 'on' : '') + '" data-src="' + src + '">' +
                    (m.dot ? '<span class="dot" style="background:' + (S.source === src ? '#fff' : m.dot) + '"></span>' : '') +
                    m.label + '<span class="n">' + count + '</span></button>';
            }).join('');

            // KPIs
            var uniquePeriod = (S.source === 'all' && d.uniquePeriod != null) ? d.uniquePeriod : uniqueBy(fv);
            var periodTotal = S.source === 'all' ? (d.periodTotal || 0) : Object.keys(fd).reduce(function (a, k) { return a + fd[k]; }, 0);
            var trend = (S.source === 'all' && d.prevPeriodTotal) ? ((periodTotal - d.prevPeriodTotal) / d.prevPeriodTotal) * 100 : null;
            var today = new Date().toISOString().split('T')[0];
            var countryList = countryEntries();
            var kpis = [
                { lab: '전체 방문', val: num(d.totalVisits), sub: '누적' },
                { lab: '방문 · ' + pl, val: num(periodTotal), trend: trend, sub: trend != null ? '이전 기간 대비' : '' },
                { lab: '순 방문자', val: num(uniquePeriod), sub: d.uniqueTotal ? ('누적 ' + num(d.uniqueTotal)) : 'IP 기준' },
                { lab: '페이지뷰', val: num(d.totalPageViews), sub: '누적 조회' },
                { lab: '평균 체류', val: fmtDur(d.avgDwellSec), sub: '페이지당' },
                { lab: '국가', val: countryList.length, sub: S.countryScope === 'all' ? '누적' : pl },
                { lab: '오늘', val: num(fd[today] || 0), sub: '' },
            ];
            $('kpis').innerHTML = kpis.map(function (k) {
                var t = '';
                if (k.trend != null) t = '<span class="trend ' + (k.trend >= 0 ? 'up' : 'down') + '">' + (k.trend >= 0 ? '▲' : '▼') + ' ' + Math.abs(Math.round(k.trend)) + '%</span>';
                return '<div class="kpi"><div class="lab">' + esc(k.lab) + '</div><div class="val">' + k.val + t + '</div>' + (k.sub ? '<div class="sub">' + esc(k.sub) + '</div>' : '') + '</div>';
            }).join('');

            // chart
            renderChart(fd);

            // composition
            var parsed = fv.map(function (v) { var p = parseUA(v.userAgent); return { v: v, device: p.device, os: p.os, browser: p.browser }; });
            var srcItems = ['human', 'build', 'bot'].map(function (s) {
                return { label: SOURCE_META[s].label, value: S.source === 'all' ? sc[s] : (S.source === s ? fv.length : 0), dot: SOURCE_META[s].dot };
            }).filter(function (i) { return i.value > 0; });
            $('composition').innerHTML =
                panel('유입 유형', '', barList(srcItems, fv.length, {})) +
                panel('기기', '', barList(tally(parsed, function (p) { return p.device; }), fv.length, {})) +
                panel('OS', '', barList(tally(parsed, function (p) { return p.os; }), fv.length, {})) +
                panel('브라우저', '', barList(tally(parsed, function (p) { return p.browser; }), fv.length, {}));

            // heatmap
            renderHeat(fv);

            // geography
            var cities = tally(fv.filter(function (v) { return v.city && v.city !== 'Unknown'; }), function (v) { return v.city + '|' + v.country; })
                .map(function (c) { var parts = c.label.split('|'); return { label: esc(parts[0]), sub: parts[1], value: c.value }; });
            $('geo').innerHTML =
                '<div class="panel"><div class="head"><div><h2>국가</h2></div>' +
                '<div class="seg" id="cscope"><button data-sc="period" class="' + (S.countryScope === 'period' ? 'on' : '') + '">' + pl + '</button><button data-sc="all" class="' + (S.countryScope === 'all' ? 'on' : '') + '">누적</button></div></div>' +
                '<div class="body">' + barList(countryList.slice(0, 12).map(function (c) {
                    return { label: '<button class="cbtn ' + (S.country === c.label ? 'on' : '') + '" data-country="' + esc(c.label) + '">' + esc(c.label) + '</button>', value: c.value };
                }), countryList.reduce(function (s, c) { return s + c.value; }, 0), {}) + '</div></div>' +
                panel('도시', '', barList(cities.slice(0, 12), cities.reduce(function (s, c) { return s + c.value; }, 0), { empty: '도시 데이터 없음' }));

            // acquisition: referrer / landing / top pages
            var referrers = tally(fv, function (v) { return (v.referrer && String(v.referrer).trim()) ? esc(v.referrer) : 'Direct / 직접'; });
            var landing = tally(fv, function (v) { return esc(v.path || '/'); });
            var pageList = Object.keys((d.pageViews) || {}).map(function (k) { return { label: esc(k), raw: k, value: Number(d.pageViews[k]) }; }).sort(function (a, b) { return b.value - a.value; });
            $('acq').innerHTML =
                panel('유입 경로 (Referrer)', '', barList(referrers.slice(0, 8), fv.length, { empty: '경로 데이터 없음' })) +
                panel('랜딩 페이지', '세션 첫 진입', barList(landing.slice(0, 8), fv.length, { empty: '페이지 데이터 없음' })) +
                panel('인기 페이지', '조회수 · 평균 체류', barList(pageList.slice(0, 8).map(function (p) {
                    return { label: p.label, value: p.value, sub: (d.pageDwell && d.pageDwell[p.raw]) ? fmtDur(d.pageDwell[p.raw]) : '' };
                }), pageList.reduce(function (s, p) { return s + p.value; }, 0), { empty: '조회 데이터 없음' }));

            // tech: language / screen / domestic
            var langs = tally(fv, function (v) { return v.language ? esc(v.language) : null; });
            var screens = tally(fv, function (v) { return v.screen ? esc(v.screen) : null; });
            var kr = fv.filter(function (v) { return v.country === 'KR'; }).length;
            $('tech').innerHTML =
                panel('언어', '', barList(langs.slice(0, 8), fv.length, { empty: '언어 데이터 없음' })) +
                panel('화면 해상도', '', barList(screens.slice(0, 8), fv.length, { empty: '해상도 데이터 없음' })) +
                panel('국내 / 해외', '', barList([
                    { label: '국내 (KR)', value: kr, dot: NAVY },
                    { label: '해외', value: fv.length - kr, dot: '#A8A29E' },
                ].filter(function (i) { return i.value > 0; }), fv.length, {}));

            // sessions
            renderSessions();

            // detail table
            renderTable(fv);

            bindDynamic();
        }

        function uniqueBy(visits) { var s = {}; visits.forEach(function (v) { s[v.ip] = 1; }); return Object.keys(s).length; }

        function countryEntries() {
            var d = S.data, src;
            if (S.countryScope === 'all') src = d.allCountries || {};
            else if (S.source === 'all' && d.countries) src = d.countries;
            else {
                src = {}; filteredVisits().forEach(function (v) { if (v.country) src[v.country] = (src[v.country] || 0) + 1; });
            }
            return Object.keys(src).map(function (k) { return { label: k, value: Number(src[k]) }; }).sort(function (a, b) { return b.value - a.value; });
        }

        function renderChart(fd) {
            var du = (S.data && S.data.dailyUnique) || {};
            var rows = Object.keys(fd).sort().map(function (date) {
                return { date: date, visits: fd[date], unique: (S.source === 'all' && du[date] != null) ? du[date] : null };
            });
            var sub = '';
            if (rows.length) {
                var avg = rows.reduce(function (s, r) { return s + r.visits; }, 0) / rows.length;
                sub = '평균 ' + avg.toFixed(1) + '/일';
                if (S.source === 'all' && rows.some(function (r) { return r.unique != null; })) sub += ' · 방문(면) vs 순방문자(점선)';
            }
            $('chartSub').textContent = sub;
            if (!rows.length) { $('chart').innerHTML = '<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center">데이터 없음</div>'; return; }

            var W = 900, H = 280, padL = 36, padR = 12, padT = 12, padB = 26;
            var iw = W - padL - padR, ih = H - padT - padB;
            var maxV = Math.max.apply(null, [1].concat(rows.map(function (r) { return Math.max(r.visits, r.unique || 0); })));
            var n = rows.length;
            var x = function (i) { return padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw); };
            var y = function (v) { return padT + ih - (v / maxV) * ih; };
            var showU = S.source === 'all' && rows.some(function (r) { return r.unique != null; });
            var avgVal = rows.reduce(function (s, r) { return s + r.visits; }, 0) / n;

            function line(key) { return rows.map(function (r, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[key] || 0).toFixed(1); }).join(' '); }
            var area = 'M' + x(0).toFixed(1) + ' ' + y(rows[0].visits).toFixed(1) + ' ' +
                rows.map(function (r, i) { return 'L' + x(i).toFixed(1) + ' ' + y(r.visits).toFixed(1); }).join(' ') +
                ' L' + x(n - 1).toFixed(1) + ' ' + (padT + ih) + ' L' + x(0).toFixed(1) + ' ' + (padT + ih) + ' Z';

            // gridlines + y labels
            var grid = '', ticks = 4;
            for (var g = 0; g <= ticks; g++) {
                var gv = Math.round((maxV / ticks) * g), gy = y(gv);
                grid += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="' + GRID + '" stroke-dasharray="3 3"/>' +
                    '<text x="' + (padL - 6) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="' + INK3 + '" font-family="monospace">' + gv + '</text>';
            }
            // x labels
            var xl = '', step = Math.ceil(n / 8);
            rows.forEach(function (r, i) {
                if (i % step !== 0 && i !== n - 1) return;
                xl += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="' + INK3 + '" font-family="monospace">' + esc(r.date.slice(5)) + '</text>';
            });
            var dots = rows.map(function (r, i) { return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(r.visits).toFixed(1) + '" r="2.5" fill="' + CRIMSON + '"><title>' + esc(r.date) + ': ' + r.visits + '</title></circle>'; }).join('');

            var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
                '<defs><linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + CRIMSON + '" stop-opacity="0.20"/><stop offset="100%" stop-color="' + CRIMSON + '" stop-opacity="0.02"/></linearGradient></defs>' +
                grid +
                '<line x1="' + padL + '" y1="' + y(avgVal).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y(avgVal).toFixed(1) + '" stroke="' + INK3 + '" stroke-dasharray="4 4" stroke-opacity="0.5"/>' +
                '<path d="' + area + '" fill="url(#cf)"/>' +
                '<path d="' + line('visits') + '" fill="none" stroke="' + CRIMSON + '" stroke-width="2"/>' +
                (showU ? '<path d="' + line('unique') + '" fill="none" stroke="' + INK3 + '" stroke-width="1.5" stroke-dasharray="4 3"/>' : '') +
                dots + xl + '</svg>';
            $('chart').innerHTML = svg;
        }

        function renderHeat(fv) {
            var m = [], max = 0;
            for (var i = 0; i < 7; i++) m.push(new Array(24).fill(0));
            fv.forEach(function (v) { var dt = new Date(v.timestamp); var wd = dt.getDay(), h = dt.getHours(); if (!isNaN(wd) && !isNaN(h)) { m[wd][h]++; if (m[wd][h] > max) max = m[wd][h]; } });
            if (!fv.length) { $('heat').innerHTML = '<p class="empty">데이터 없음</p>'; $('heatSub').textContent = ''; return; }
            var bh = 0, bwd = 0, bmax = -1;
            for (var w = 0; w < 7; w++) for (var hh = 0; hh < 24; hh++) if (m[w][hh] > bmax) { bmax = m[w][hh]; bwd = w; bh = hh; }
            $('heatSub').textContent = '가장 붐빔 · ' + WEEKDAYS[bwd] + '요일 ' + String(bh).padStart(2, '0') + '시';
            var html = '';
            for (var r = 0; r < 7; r++) {
                html += '<div class="r"><span class="wd">' + WEEKDAYS[r] + '</span><div class="cells">';
                for (var c = 0; c < 24; c++) {
                    var val = m[r][c];
                    var bg = val ? 'rgba(27,54,93,' + (0.12 + 0.88 * (val / max)).toFixed(3) + ')' : '#F1F4F8';
                    html += '<div class="c" style="background:' + bg + '" title="' + WEEKDAYS[r] + '요일 ' + String(c).padStart(2, '0') + '시 · ' + val + '"></div>';
                }
                html += '</div></div>';
            }
            html += '<div class="r"><span class="wd"></span><div class="axis">';
            for (var a = 0; a < 24; a++) html += '<span>' + (a % 3 === 0 ? String(a).padStart(2, '0') : '') + '</span>';
            html += '</div></div>';
            $('heat').innerHTML = html;
        }

        function renderSessions() {
            var sess = (S.data && S.data.sessions) || [];
            if (!sess.length) { $('sessionsPanel').innerHTML = ''; return; }
            var rows = sess.map(function (s) {
                var chips = s.paths.slice(0, 12).map(function (p, j) {
                    return (j ? '<span class="arr">›</span>' : '') + '<span class="pth">' + esc(p) + '</span>';
                }).join('');
                var more = s.paths.length > 12 ? '<span class="arr">+' + (s.paths.length - 12) + '</span>' : '';
                return '<div class="sess"><div class="paths"><span class="who"><b>' + esc(s.country) + '</b>' + (s.device ? '<span> · ' + esc(s.device) + '</span>' : '') + '</span>' + chips + more + '</div>' +
                    '<div class="stat"><span>' + s.paths.length + 'p</span><span>' + fmtDur(Math.round(s.ms / 1000)) + '</span></div></div>';
            }).join('');
            $('sessionsPanel').innerHTML = '<div class="panel"><div class="head"><div><h2>세션 여정</h2><div class="psub">최근 ' + sess.length + ' 세션 · 방문자가 본 순서</div></div></div><div class="body"><div class="sessions">' + rows + '</div></div></div>';
        }

        function searchedVisits() {
            var fv = filteredVisits(), q = S.search.trim().toLowerCase();
            if (!q) return fv;
            return fv.filter(function (v) {
                return (v.country + ' ' + v.region + ' ' + v.city + ' ' + v.userAgent + ' ' + (v.path || '') + ' ' + (v.referrer || '')).toLowerCase().indexOf(q) > -1;
            });
        }

        function renderTable(fv) {
            var sv = searchedVisits();
            $('tblSub').textContent = num(sv.length) + '건' + (S.search ? (' / ' + num(fv.length)) : '');
            var head = '<thead><tr>' +
                '<th>시각</th><th>유형</th><th>기기</th><th class="hide-md">브라우저</th><th>위치</th><th class="hide-lg">유입</th><th class="hide-lg">페이지</th>' +
                '</tr></thead>';
            var body = sv.map(function (v, i) {
                var src = classifyUA(v.userAgent), ua = parseUA(v.userAgent), open = S.expanded === i;
                var when = new Date(v.timestamp).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                var row = '<tr class="click ' + (open ? 'open' : '') + '" data-row="' + i + '">' +
                    '<td class="mono" style="white-space:nowrap;color:var(--ink-3)">' + esc(when) + '</td>' +
                    '<td><span class="badge"><span class="dot" style="background:' + SOURCE_META[src].dot + '"></span>' + SOURCE_META[src].label + '</span></td>' +
                    '<td style="white-space:nowrap">' + esc(ua.device) + ' · ' + esc(ua.os) + '</td>' +
                    '<td class="hide-md" style="white-space:nowrap">' + esc(ua.browser) + '</td>' +
                    '<td><b>' + esc(v.country) + '</b>' + (v.city && v.city !== 'Unknown' ? '<span style="color:var(--ink-4)"> · ' + esc(v.city) + '</span>' : '') + '</td>' +
                    '<td class="hide-lg" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3)">' + esc(v.referrer || '직접') + '</td>' +
                    '<td class="hide-lg mono" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3)">' + esc(v.path || '/') + '</td></tr>';
                if (open) {
                    var full = new Date(v.timestamp).toLocaleString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    var pairs = [
                        ['시각', full], ['국가 / 지역 / 도시', v.country + ' · ' + v.region + ' · ' + v.city], ['IP', v.ip],
                        ['기기 / OS / 브라우저', ua.device + ' · ' + ua.os + ' · ' + ua.browser], ['언어', v.language || '—'], ['화면', v.screen || '—'],
                        ['유입 경로', v.referrer || '직접'], ['방문 페이지', v.path || '/'],
                    ];
                    row += '<tr class="exp open"><td colspan="7"><dl>' + pairs.map(function (p) { return '<div><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>'; }).join('') +
                        '<div class="full"><dt>User-Agent</dt><dd>' + esc(v.userAgent) + '</dd></div></dl></td></tr>';
                }
                return row;
            }).join('');
            if (!sv.length) body = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--ink-4)">' + (S.search ? '검색 결과 없음' : '기록 없음') + '</td></tr>';
            $('tbl').innerHTML = head + '<tbody>' + body + '</tbody>';
        }

        function exportCsv() {
            var cols = ['timestamp', 'source', 'device', 'os', 'browser', 'country', 'region', 'city', 'ip', 'referrer', 'path', 'language', 'screen', 'userAgent'];
            var escc = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
            var rows = searchedVisits().map(function (v) {
                var u = parseUA(v.userAgent);
                return [v.timestamp, classifyUA(v.userAgent), u.device, u.os, u.browser, v.country, v.region, v.city, v.ip, v.referrer || '', v.path || '', v.language || '', v.screen || '', v.userAgent];
            });
            var csv = [cols.join(',')].concat(rows.map(function (r) { return r.map(escc).join(','); })).join('\n');
            var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = 'piost-visits-' + new Date().toISOString().split('T')[0] + '.csv';
            a.click(); URL.revokeObjectURL(url);
        }

        // ── event binding ────────────────────────────────────────────────────
        function bindDynamic() {
            Array.prototype.forEach.call($('periodSeg').querySelectorAll('button'), function (b) {
                b.onclick = function () { fetchAnalytics(S.pw, Number(b.getAttribute('data-d'))); };
            });
            Array.prototype.forEach.call($('sourceFilters').querySelectorAll('button'), function (b) {
                b.onclick = function () { S.source = b.getAttribute('data-src'); S.expanded = null; render(); };
            });
            var cscope = $('cscope');
            if (cscope) Array.prototype.forEach.call(cscope.querySelectorAll('button'), function (b) {
                b.onclick = function () { S.countryScope = b.getAttribute('data-sc'); render(); };
            });
            Array.prototype.forEach.call(document.querySelectorAll('[data-country]'), function (b) {
                b.onclick = function () { var c = b.getAttribute('data-country'); S.country = (S.country === c ? null : c); render(); };
            });
            Array.prototype.forEach.call($('tbl').querySelectorAll('tr.click'), function (tr) {
                tr.onclick = function () { var i = Number(tr.getAttribute('data-row')); S.expanded = (S.expanded === i ? null : i); renderTable(filteredVisits()); bindTableRows(); };
            });
        }
        function bindTableRows() {
            Array.prototype.forEach.call($('tbl').querySelectorAll('tr.click'), function (tr) {
                tr.onclick = function () { var i = Number(tr.getAttribute('data-row')); S.expanded = (S.expanded === i ? null : i); renderTable(filteredVisits()); bindTableRows(); };
            });
        }

        // ── static event binding ─────────────────────────────────────────────
        $('loginForm').addEventListener('submit', function (e) { e.preventDefault(); $('loginErr').style.display = 'none'; fetchAnalytics($('pw').value, S.period); });
        $('togglePw').addEventListener('click', function () { var i = $('pw'); i.type = i.type === 'password' ? 'text' : 'password'; });
        $('refreshBtn').addEventListener('click', function () { if (!S.loading) fetchAnalytics(S.pw, S.period); });
        $('logoutBtn').addEventListener('click', function () { try { localStorage.removeItem('piost_admin_pwd'); } catch (e) {} S.pw = ''; S.data = null; $('pw').value = ''; showLogin(); });
        $('search').addEventListener('input', function (e) { S.search = e.target.value; S.expanded = null; renderTable(filteredVisits()); bindTableRows(); });
        $('csvBtn').addEventListener('click', exportCsv);

        // ── boot ─────────────────────────────────────────────────────────────
        (function boot() {
            var stored = null;
            try { stored = localStorage.getItem('piost_admin_pwd'); } catch (e) {}
            if (stored) { $('pw').value = stored; fetchAnalytics(stored, S.period); }
        })();
    })();
    </script>
</body>
</html>
